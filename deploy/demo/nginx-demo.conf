# demo.valuestream.in - the demo hub at /, one product per path (/tax now; /legal, /medical later: copy the /tax block).
# Install: cp to /etc/nginx/sites-available/demo.valuestream.in, ln -s into sites-enabled, nginx -t, reload, then
#          certbot --nginx -d demo.valuestream.in   (adds the HTTPS server block and the redirect)
server {
    listen 80;
    server_name demo.valuestream.in;
    client_max_body_size 30m;

    root /opt/simplyfile/deploy/demo/hub;
    location = / { try_files /index.html =404; }
    location = /products.json { try_files /products.json =404; }

    location = /tax { return 301 /tax/; }
    location /tax/ {
        proxy_pass http://127.0.0.1:8840;           # the path is passed through: the app runs with PORTAL_BASE=/tax
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Justify (jf.valuestream.in) - its demo service justify-demo-legal on 8841 (setup.sh legal 8841 <snapshot> justify)
    location = /legal { return 301 /legal/; }
    location /legal/ {
        proxy_pass http://127.0.0.1:8841;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # DummyFy (df.valuestream.in) - its demo service dummyfy-demo-dummyfy on 8842 (setup.sh dummyfy 8842 <snapshot> dummyfy).
    # 250 MB uploads: the demo takes what the product takes (chip jobs.settings max_mb).
    location = /dummyfy { return 301 /dummyfy/; }
    location /dummyfy/ {
        client_max_body_size 260m;
        proxy_pass http://127.0.0.1:8842;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    # HealthyFy (hf.valuestream.in) - its demo service healthyfy-demo-healthyfy on 8843 (setup.sh healthyfy 8843 <snapshot> healthyfy).
    location = /healthyfy { return 301 /healthyfy/; }
    location /healthyfy/ {
        client_max_body_size 25m;
        proxy_pass http://127.0.0.1:8843;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # TradyFy (tf.valuestream.in) - its demo service tradyfy-demo-tradyfy on 8844 (setup.sh tradyfy 8844 <snapshot> tradyfy).
    location = /tradyfy { return 301 /tradyfy/; }
    location /tradyfy/ {
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:8844;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
}
