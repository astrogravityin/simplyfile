<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ValueStream demos</title>
<meta name="description" content="Try ValueStream's products with sample data."/>
<style>
  /* demo.valuestream.in - one card per product, read from products.json (add Legal / Medical there, and a /legal block in nginx) */
  :root { --bg:#f6f7fb; --card:#fff; --ink:#151827; --muted:#5b6175; --line:#e3e6ef; --brand:#5b4bdb; --brand-ink:#fff; --soft:#efedff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1220; --card:#171b2e; --ink:#eef0f8; --muted:#a3a9c0; --line:#2a3050; --brand:#8577ff; --brand-ink:#0f1220; --soft:#25254a; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width:960px; margin:0 auto; padding:56px 16px 40px; }
  h1 { font-size:clamp(28px, 4vw, 40px); line-height:1.15; margin:0 0 12px; letter-spacing:-.01em; }
  .lede { color:var(--muted); max-width:640px; margin:0 0 36px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px; display:flex; flex-direction:column; gap:10px; }
  .kind { font-size:13px; font-weight:600; color:var(--brand); text-transform:uppercase; letter-spacing:.06em; }
  .card h2 { margin:0; font-size:22px; }
  .card p { margin:0; color:var(--muted); font-size:15px; }
  .acts { display:flex; gap:10px; flex-wrap:wrap; margin-top:auto; padding-top:10px; }
  .btn { display:inline-flex; align-items:center; gap:8px; padding:10px 16px; border-radius:10px; font-weight:600; text-decoration:none; font-size:15px; }
  .btn.primary { background:var(--brand); color:var(--brand-ink); }
  .btn.ghost { background:var(--soft); color:var(--ink); }
  .soon { opacity:.7 } .soon .acts { color:var(--muted); font-size:14px; }
  footer { margin-top:40px; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<main>
  <h1 id="title">ValueStream demos</h1>
  <p class="lede" id="lede"></p>
  <div class="grid" id="grid"></div>
  <footer id="footer"></footer>
</main>
<script>
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  fetch('products.json', { cache: 'no-cache' }).then((r) => r.json()).then((d) => {
    document.title = d.title; document.getElementById('title').textContent = d.title;
    document.getElementById('lede').textContent = d.lede; document.getElementById('footer').textContent = d.footer || '';
    document.getElementById('grid').innerHTML = d.products.map((p) => `<article class="card ${p.status === 'live' ? '' : 'soon'}">
      <span class="kind">${esc(p.kind)}</span><h2>${esc(p.name)}</h2><p>${esc(p.about)}</p>
      <div class="acts">${p.status === 'live'
        ? `<a class="btn primary" href="${esc(p.href)}">Try the demo &rarr;</a>${p.videos ? `<a class="btn ghost" href="${esc(p.videos)}" target="_blank" rel="noopener">Watch the tour</a>` : ''}`
        : 'Coming soon'}</div></article>`).join('');
  }).catch(() => { document.getElementById('lede').textContent = 'The demo list could not be loaded - please refresh.'; });
</script>
</body>
</html>
