<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ValueStream demos</title>
<meta name="description" content="Live demos of ValueStream's products - a working practice with sample data, reset every night."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<style>
  /* demo.valuestream.in - every word is in products.json (add Legal / Medical there, and a /legal block in nginx).
     This page only draws it, and counts down to the nightly reset (products.json reset_utc = the cron in setup.sh). */
  :root {
    --bg:#f7f6f2; --paper:#fffefb; --ink:#14152a; --muted:#5c5f73; --line:#e6e3da; --brand:#4b3fd1; --brand-2:#7a6cff;
    --brand-ink:#fff; --soft:#eeecff; --gold:#c08a2c; --ok:#1f8a5b; --shadow:0 1px 2px rgba(20,21,42,.04), 0 12px 32px -12px rgba(20,21,42,.14);
    --serif:"Instrument Serif", Georgia, "Times New Roman", serif; --sans:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#0d0f1c; --paper:#151829; --ink:#eef0f8; --muted:#a2a7bf; --line:#262b45; --brand:#8a7dff; --brand-2:#b3a9ff;
    --brand-ink:#0d0f1c; --soft:#22234a; --gold:#e0b25a; --ok:#4fd19a; --shadow:0 1px 2px rgba(0,0,0,.3), 0 16px 40px -16px rgba(0,0,0,.6);
  } }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 var(--sans); -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  a { color:inherit; }
  .wrap { max-width:1120px; margin:0 auto; padding:0 20px; }
  .eyebrow { display:inline-flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--brand); }
  .eyebrow::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 4px color-mix(in srgb, var(--ok) 20%, transparent); animation:pulse 2.4s infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 8px transparent; } }
  h1, h2 { font-family:var(--serif); font-weight:400; letter-spacing:-.01em; margin:0; }

  /* top */
  .top { display:flex; align-items:center; justify-content:space-between; padding:22px 0; }
  .logo { display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:-.01em; text-decoration:none; }
  .top nav a { color:var(--muted); text-decoration:none; font-size:14.5px; margin-left:22px; }
  .top nav a:hover { color:var(--ink); }

  /* hero */
  .hero { display:grid; grid-template-columns:1.1fr .9fr; gap:48px; align-items:center; padding:48px 0 72px; }
  .hero h1 { font-size:clamp(42px, 6.2vw, 76px); line-height:1.02; margin:18px 0 22px; }
  .hero h1 em { color:var(--brand); }
  .lede { color:var(--muted); font-size:18px; max-width:560px; margin:0 0 30px; }
  .art { position:relative; }
  .art svg { width:100%; height:auto; display:block; filter:drop-shadow(0 30px 40px rgba(40,30,120,.12)); }
  .float { animation:float 7s ease-in-out infinite; transform-origin:center; }
  .float.b { animation-delay:-3.5s; }
  @keyframes float { 50% { transform:translateY(-8px); } }
  @media (prefers-reduced-motion: reduce) { .float, .eyebrow::before { animation:none; } }

  /* the clock */
  .clock { background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:22px 24px; box-shadow:var(--shadow); display:flex; gap:20px; align-items:center; max-width:560px; }
  .clock .dial { flex:none; width:64px; height:64px; }
  .clock h3 { margin:0 0 2px; font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .digits { display:flex; gap:6px; align-items:baseline; font-variant-numeric:tabular-nums; flex-wrap:wrap; }
  .digits b { font-family:var(--serif); font-weight:400; font-size:38px; line-height:1.1; }
  .digits span { color:var(--muted); font-size:14px; margin-right:10px; }
  .clock .at { font-size:14px; color:var(--muted); }

  /* sections */
  section { padding:64px 0; }
  .sec-h { font-size:clamp(30px, 4vw, 44px); margin:0 0 32px; }
  .steps { display:grid; grid-template-columns:repeat(3, 1fr); gap:20px; counter-reset:n; }
  .step { position:relative; padding:28px 24px 24px; border-radius:18px; background:var(--paper); border:1px solid var(--line); }
  .step::before { counter-increment:n; content:"0" counter(n); position:absolute; top:22px; right:24px; font-family:var(--serif); font-size:28px; color:var(--line); }
  .step h4, .trust h4 { margin:14px 0 6px; font-size:17px; }
  .step p, .trust p { margin:0; color:var(--muted); font-size:15px; }
  .ico { width:44px; height:44px; border-radius:12px; display:grid; place-items:center; background:var(--soft); color:var(--brand); }

  .products { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:24px; }
  .prod { position:relative; overflow:hidden; background:var(--paper); border:1px solid var(--line); border-radius:24px; padding:32px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:14px; transition:transform .25s, box-shadow .25s; }
  .prod.live:hover { transform:translateY(-3px); }
  .prod::after { content:""; position:absolute; inset:0 0 auto 0; height:4px; background:linear-gradient(90deg, var(--brand), var(--brand-2), var(--gold)); }
  .prod.soon { box-shadow:none; background:transparent; border-style:dashed; }
  .prod.soon::after { display:none; }
  .kind { font-size:12.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--brand); }
  .prod h3 { font-family:var(--serif); font-weight:400; font-size:40px; line-height:1; margin:0; }
  .prod .about { margin:0; color:var(--muted); font-size:16px; }
  .points { list-style:none; margin:4px 0 0; padding:0; display:grid; gap:8px; }
  .points li { display:flex; gap:10px; font-size:15px; }
  .points svg { flex:none; margin-top:4px; color:var(--ok); }
  .stats { display:flex; gap:26px; padding:16px 0 4px; border-top:1px solid var(--line); margin-top:6px; }
  .stats b { display:block; font-family:var(--serif); font-weight:400; font-size:32px; line-height:1; }
  .stats span { font-size:13px; color:var(--muted); }
  .acts { display:flex; gap:10px; flex-wrap:wrap; margin-top:auto; padding-top:8px; }
  .btn { display:inline-flex; align-items:center; gap:8px; padding:13px 20px; border-radius:12px; font-weight:600; text-decoration:none; font-size:15px; transition:transform .15s, background .15s; }
  .btn.primary { background:var(--ink); color:var(--bg); }
  .btn.primary:hover { transform:translateX(2px); }
  .btn.ghost { border:1px solid var(--line); }
  .btn.ghost:hover { background:var(--soft); }
  .tag { display:inline-block; font-size:13px; color:var(--muted); border:1px solid var(--line); padding:6px 12px; border-radius:99px; }

  .trust { display:grid; grid-template-columns:repeat(3, 1fr); gap:28px; }
  footer { border-top:1px solid var(--line); padding:28px 0 40px; color:var(--muted); font-size:14px; }

  @media (max-width: 860px) {
    .hero { grid-template-columns:1fr; gap:24px; padding-top:20px; }
    .art { order:-1; max-width:420px; }
    .steps, .trust { grid-template-columns:1fr; }
    .top nav { display:none; }
    section { padding:44px 0; }
    .prod { padding:24px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="logo" href="/">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4b3fd1"/><stop offset="1" stop-color="#c08a2c"/></linearGradient></defs>
        <rect width="32" height="32" rx="9" fill="url(#lg)"/><path d="M8 11c4 0 4 10 8 10s4-10 8-10" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>
      <span>ValueStream</span>
    </a>
    <nav><a href="#how" id="nav-how"></a><a href="#products" id="nav-products"></a><a href="#trust" id="nav-trust"></a></nav>
  </header>

  <div class="hero">
    <div>
      <span class="eyebrow" id="eyebrow"></span>
      <h1><span id="headline"></span><br/><em id="headline-em"></em></h1>
      <p class="lede" id="lede"></p>
      <div class="clock" role="timer" aria-live="off">
        <svg class="dial" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="28" fill="none" stroke="var(--line)" stroke-width="4"/>
          <circle id="ring" cx="32" cy="32" r="28" fill="none" stroke="var(--brand)" stroke-width="4" stroke-linecap="round"
                  stroke-dasharray="175.9" stroke-dashoffset="0" transform="rotate(-90 32 32)"/>
          <path d="M32 18v14l9 6" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <div>
          <h3 id="clock-title"></h3>
          <div class="digits" id="digits"></div>
          <div class="at" id="clock-at"></div>
        </div>
      </div>
    </div>

    <div class="art" aria-hidden="true">
      <!-- a practice at work: a return in progress, a reconciled ledger, a checked audit, a teammate -->
      <svg viewBox="0 0 480 440">
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a6cff"/><stop offset="1" stop-color="#4b3fd1"/></linearGradient>
          <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1d49a"/><stop offset="1" stop-color="#c08a2c"/></linearGradient>
          <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7a6cff" stop-opacity=".35"/><stop offset="1" stop-color="#7a6cff" stop-opacity="0"/></radialGradient>
        </defs>
        <circle cx="250" cy="220" r="210" fill="url(#glow)"/>
        <g opacity=".5" stroke="var(--line)" fill="none"><circle cx="250" cy="220" r="170"/><circle cx="250" cy="220" r="120" stroke-dasharray="3 6"/></g>
        <!-- main sheet: the return -->
        <g class="float">
          <rect x="110" y="70" width="240" height="300" rx="18" fill="var(--paper)" stroke="var(--line)"/>
          <rect x="110" y="70" width="240" height="56" rx="18" fill="url(#g1)"/><rect x="110" y="108" width="240" height="18" fill="url(#g1)"/>
          <rect x="132" y="88" width="90" height="10" rx="5" fill="#fff" opacity=".9"/><rect x="132" y="104" width="54" height="7" rx="3.5" fill="#fff" opacity=".55"/>
          <g fill="var(--line)"><rect x="132" y="148" width="120" height="8" rx="4"/><rect x="132" y="190" width="150" height="8" rx="4"/><rect x="132" y="232" width="110" height="8" rx="4"/><rect x="132" y="274" width="140" height="8" rx="4"/></g>
          <g fill="var(--soft)"><rect x="276" y="142" width="52" height="20" rx="6"/><rect x="276" y="184" width="52" height="20" rx="6"/><rect x="276" y="226" width="52" height="20" rx="6"/><rect x="276" y="268" width="52" height="20" rx="6"/></g>
          <path d="M132 170h196M132 212h196M132 254h196M132 296h196" stroke="var(--line)" stroke-dasharray="2 4"/>
          <rect x="132" y="318" width="196" height="34" rx="10" fill="var(--ink)"/><rect x="152" y="331" width="76" height="8" rx="4" fill="var(--bg)" opacity=".8"/>
          <circle cx="306" cy="335" r="9" fill="#4fd19a"/><path d="M301.5 335l3 3 6-6" stroke="#0d0f1c" stroke-width="2" fill="none" stroke-linecap="round"/>
        </g>
        <!-- chart card: reconciled -->
        <g class="float b">
          <rect x="300" y="40" width="150" height="104" rx="16" fill="var(--paper)" stroke="var(--line)"/>
          <rect x="318" y="58" width="60" height="7" rx="3.5" fill="var(--muted)" opacity=".5"/>
          <g fill="url(#g1)"><rect x="320" y="104" width="14" height="24" rx="3"/><rect x="342" y="92" width="14" height="36" rx="3"/><rect x="364" y="80" width="14" height="48" rx="3"/><rect x="386" y="96" width="14" height="32" rx="3"/></g>
          <rect x="408" y="72" width="14" height="56" rx="3" fill="url(#g2)"/>
        </g>
        <!-- audit stamp -->
        <g class="float b">
          <circle cx="92" cy="300" r="50" fill="var(--paper)" stroke="var(--line)"/>
          <circle cx="92" cy="300" r="36" fill="none" stroke="url(#g2)" stroke-width="3" stroke-dasharray="4 4"/>
          <path d="M76 300l11 11 22-22" stroke="#c08a2c" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <!-- teammate -->
        <g class="float">
          <rect x="44" y="120" width="132" height="58" rx="29" fill="var(--paper)" stroke="var(--line)"/>
          <circle cx="73" cy="149" r="17" fill="url(#g2)"/><circle cx="73" cy="144" r="6" fill="#fff"/><path d="M62 158c3-6 19-6 22 0" fill="#fff"/>
          <rect x="98" y="139" width="56" height="7" rx="3.5" fill="var(--ink)" opacity=".75"/><rect x="98" y="152" width="38" height="6" rx="3" fill="var(--muted)" opacity=".45"/>
        </g>
        <!-- sparkles -->
        <g fill="#c08a2c"><path d="M410 300l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/><path d="M60 60l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z" opacity=".7"/></g>
        <g fill="#7a6cff"><circle cx="440" cy="200" r="4"/><circle cx="40" cy="230" r="3"/><circle cx="380" cy="400" r="5" opacity=".6"/></g>
      </svg>
    </div>
  </div>
</div>

<section id="how"><div class="wrap"><h2 class="sec-h" id="steps-title"></h2><div class="steps" id="steps"></div></div></section>
<section id="products"><div class="wrap"><h2 class="sec-h" id="products-title"></h2><div class="products" id="grid"></div></div></section>
<section id="trust"><div class="wrap"><h2 class="sec-h" id="trust-title"></h2><div class="trust" id="trustlist"></div></div></section>
<footer><div class="wrap" id="footer"></div></footer>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fill = (s, v) => String(s || '').replace(/\{(\w+)\}/g, (_, k) => v[k] ?? '');
  const ICONS = {
    mail: '<path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/>',
    door: '<path d="M6 21V4h10v17"/><path d="M16 4l3 2v15"/><circle cx="13" cy="12.5" r=".9" fill="currentColor"/><path d="M3 21h18"/>',
    spark: '<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>',
    shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-4.5"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
  };
  const ico = (k, n = 22) => `<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[k] || ICONS.spark}</svg>`;
  const tick = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';

  /** The next nightly reset: today's reset_utc (HH:MM, UTC), or tomorrow's once it has passed. */
  function nextReset(hhmm) {
    const [h, m] = String(hhmm || '21:30').split(':').map(Number), now = new Date();
    const t = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), h, m));
    if (t <= now) t.setUTCDate(t.getUTCDate() + 1);
    return t;
  }

  function startClock(d) {
    let at = nextReset(d.reset_utc);
    $('clock-title').textContent = d.clock_title || '';
    const draw = () => {
      let left = Math.floor((at - Date.now()) / 1000);
      if (left < -90) { at = nextReset(d.reset_utc); left = Math.floor((at - Date.now()) / 1000); }   // a minute's grace while the reset runs
      if (left <= 0) { $('digits').innerHTML = `<span>${esc(d.clock_now)}</span>`; return; }
      const [uh, um, us] = (d.units || ['h', 'm', 's']).map(esc), h = Math.floor(left / 3600), m = Math.floor(left / 60) % 60, s = left % 60;
      $('digits').innerHTML = `<b>${h}</b><span>${uh}</span><b>${String(m).padStart(2, '0')}</b><span>${um}</span><b>${String(s).padStart(2, '0')}</b><span>${us}</span>`;
      $('ring').setAttribute('stroke-dashoffset', String(175.9 * (1 - left / 86400)));
      $('clock-at').textContent = fill(d.clock_at, { when: at.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) }) + ' - ' + (d.clock_note || '');
    };
    draw(); setInterval(draw, 1000);
  }

  fetch('products.json', { cache: 'no-cache' }).then((r) => r.json()).then((d) => {
    document.title = d.title;
    $('eyebrow').textContent = d.eyebrow || ''; $('headline').textContent = d.headline || d.title; $('headline-em').textContent = d.headline_em || '';
    $('lede').textContent = d.lede; $('footer').textContent = d.footer || '';
    $('steps-title').textContent = d.steps_title || ''; $('products-title').textContent = d.products_title || ''; $('trust-title').textContent = d.trust_title || '';
    ['nav-how', 'nav-products', 'nav-trust'].forEach((id, i) => { $(id).textContent = (d.nav || [])[i] || ''; });
    $('steps').innerHTML = (d.steps || []).map(([i, h, p]) => `<div class="step"><div class="ico">${ico(i)}</div><h4>${esc(h)}</h4><p>${esc(p)}</p></div>`).join('');
    $('trustlist').innerHTML = (d.trust || []).map(([i, h, p]) => `<div><div class="ico">${ico(i)}</div><h4>${esc(h)}</h4><p>${esc(p)}</p></div>`).join('');
    $('grid').innerHTML = d.products.map((p) => {
      const live = p.status === 'live';
      return `<article class="prod ${live ? 'live' : 'soon'}">
        <span class="kind">${esc(p.kind)}</span><h3>${esc(p.name)}</h3><p class="about">${esc(p.about)}</p>
        ${(p.points || []).length ? `<ul class="points">${p.points.map((x) => `<li>${tick}<span>${esc(x)}</span></li>`).join('')}</ul>` : ''}
        ${(p.stats || []).length ? `<div class="stats">${p.stats.map(([n, l]) => `<div><b>${esc(n)}</b><span>${esc(l)}</span></div>`).join('')}</div>` : ''}
        <div class="acts">${live
          ? `<a class="btn primary" href="${esc(p.href)}">${esc(d.try)} &rarr;</a>${p.videos ? `<a class="btn ghost" href="${esc(p.videos)}" target="_blank" rel="noopener">${esc(d.watch)}</a>` : ''}`
          : `<span class="tag">${esc(d.soon)}</span>${p.videos ? `<a class="btn ghost" href="${esc(p.videos)}" target="_blank" rel="noopener">${esc(d.watch)}</a>` : ''}`}</div></article>`;
    }).join('');
    startClock(d);
  }).catch(() => { $('lede').textContent = 'The demo list could not be loaded - please refresh.'; });
</script>
</body>
</html>
